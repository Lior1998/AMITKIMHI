<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>מתנה מיוחדת לאבא היקר!</title>

    <!-- תצוגה מקדימה לוואטסאפ -->
    <meta property="og:title" content="מתנה מיוחדת לאבא היקר שלנו! 🎁" />
    <meta property="og:description" content="הכנו לך כרטיס מתנה דיגיטלי מכל הלב - לחץ לצפייה ולמימוש ❤️" />
    <meta property="og:image" content="WhatsApp Image 2026-09-13 at 20.50.10.jpeg" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@600;700;900&display=swap" rel="stylesheet">

    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold: #f4c453;
            --gold-glow: rgba(244, 196, 83, 0.35);
            --card-bg: rgba(14, 17, 26, 0.92);
            --border: rgba(244, 196, 83, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            background-color: #080a10;
            font-family: 'Assistant', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* רקע עוטף מלא לאייפון ולמחשב */
        .app-layout {
            position: relative;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: env(safe-area-inset-top, 14px) 14px env(safe-area-inset-bottom, 18px);
            z-index: 5;
        }

        /* שכבת רקע מטושטשת למילוי שולי המסך */
        .ambient-bg {
            position: fixed;
            inset: -20px;
            background-image: url('WhatsApp Image 2026-09-13 at 20.50.10.jpeg');
            background-size: cover;
            background-position: center;
            filter: blur(28px) brightness(0.28) saturate(1.2);
            transform: scale(1.1);
            z-index: 1;
        }

        .dark-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(8, 10, 16, 0.3) 0%, rgba(5, 7, 11, 0.85) 100%);
            z-index: 2;
        }

        /* אזור התמונה המרכזית - מבטיח שרואים את כולם בלי שייחתך אף אדם */
        .photo-stage {
            width: 100%;
            max-width: 480px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0 14px;
        }

        .photo-frame {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0,0,0,0.5);
            border: 1.5px solid var(--border);
            background: #000;
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            max-height: 44dvh; /* הגבלה שלא תתפוס יותר מדי גובה באייפון */
            object-fit: contain; /* לא חותך אף אדם בצדדים */
            display: block;
            margin: 0 auto;
        }

        .photo-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(14, 17, 26, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* כרטיס הברכה והמימוש */
        .gift-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--border);
            border-radius: 22px;
            padding: 16px 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 25px var(--gold-glow);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-family: 'Rubik', sans-serif;
            font-size: 1.45rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .greeting-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 9px 12px;
            margin-bottom: 12px;
            width: 100%;
        }

        .greeting-text {
            font-size: 0.92rem;
            line-height: 1.45;
            color: #e2e8f0;
            white-space: pre-line;
        }

        /* כפתור ה-BUYME */
        .buyme-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #ffe082 0%, #f4c453 50%, #c49320 100%);
            color: #10131d;
            font-family: 'Rubik', sans-serif;
            font-size: 1.12rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(244, 196, 83, 0.35);
            transition: transform 0.15s ease;
        }

        .buyme-btn:active {
            transform: scale(0.97);
        }

        .buyme-subtext {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- שכבת רקע אמביינטית מותאמת לגודל המסך -->
    <div class="ambient-bg"></div>
    <div class="dark-vignette"></div>

    <main class="app-layout">
        
        <!-- אזור התמונה המשפחתית: כולם מוצגים במלואם, בלי שום גזירה -->
        <section class="photo-stage">
            <div class="photo-frame">
                <span class="photo-badge">❤️ המשפחה</span>
                <img src="WhatsApp Image 2026-09-13 at 20.50.10.jpeg" alt="תמונה משפחתית לאבא">
            </div>
        </section>

        <!-- כרטיס הברכה וכפתור המימוש המותאמים למסך האייפון -->
        <section class="gift-sheet">
            <h1 class="title">לאבא היקר שלנו!</h1>
            <div class="subtitle">אוהבים ומעריכים מכל הלב ❤️</div>

            <div class="greeting-box">
                <p class="greeting-text">
תודה על כל מה שאתה עושה בשבילנו תמיד.
מאחלים לך המון בריאות, שמחה והגשמת חלומות!
הכנו לך מתנה מפנקת מכל הלב.
אוהבים אותך הכי בעולם!
                </p>
            </div>

            <!-- כפתור למימוש ה-BUYME -->
            <a href="https://buyme.co.il/G5uan728dpsjj0" 
               class="buyme-btn" 
               target="_blank" 
               rel="noopener noreferrer" 
               onclick="triggerConfetti()">
                <span>למימוש ה-GIFTCARD 🎁</span>
            </a>

            <div class="buyme-subtext">שובר אישי לרכישה ב-BUYME</div>
        </section>

    </main>

    <script>
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.8 },
                    colors: ['#f4c453', '#ffffff', '#ffd54f', '#ff5252']
                });
            }
        }
    </script>
</body>
</html>
