<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתנה מיוחדת לאבא היקר!</title>

    <!-- תגיות תצוגה מקדימה לוואטסאפ -->
    <meta property="og:title" content="מתנה מיוחדת לאבא היקר שלנו! 🎁" />
    <meta property="og:description" content="נכנסים לראות את כרטיס המתנה והברכה המשפחתית שהכנו במיוחד בשבילך ❤️" />
    <meta property="og:image" content="WhatsApp Image 2026-09-13 at 20.50.10.jpeg" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- ספריית קונפטי -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-gold: #e5b95c;
            --primary-gold-dark: #b8860b;
            --bg-dark: #0f111a;
            --card-surface: rgba(18, 22, 36, 0.75);
            --border-glass: rgba(229, 185, 92, 0.35);
            --text-main: #f8fafc;
            --text-dim: #cbd5e1;
            --accent-glow: rgba(229, 185, 92, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Assistant', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            padding: 24px 16px;
        }

        /* תמונת הרקע המשפחתית */
        #bg-layer {
            position: fixed;
            inset: -20px;
            background-image: url('WhatsApp Image 2026-09-13 at 20.50.10.jpeg');
            background-size: cover;
            background-position: center center;
            filter: blur(12px) brightness(0.38) saturate(1.2);
            transform: scale(1.05);
            z-index: 0;
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(15, 17, 26, 0.4) 0%, rgba(10, 12, 18, 0.88) 100%);
            z-index: 1;
        }

        /* מיכל הכרטיס */
        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            perspective: 1200px;
            margin: auto;
        }

        .gift-card {
            position: relative;
            background: var(--card-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--border-glass);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 35px var(--accent-glow);
            padding: 38px 28px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
        }

        .gift-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), 0 0 45px rgba(229, 185, 92, 0.6);
        }

        .badge {
            background: linear-gradient(135deg, rgba(229, 185, 92, 0.25), rgba(229, 185, 92, 0.08));
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-gold);
            letter-spacing: 0.8px;
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* תמונת המשפחה במרכז */
        .card-avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 20px;
        }

        .card-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }

        .card-avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1.5px dashed var(--primary-gold);
            animation: spinRing 24s linear infinite;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        /* כותרות וטקסט */
        .title {
            font-family: 'Rubik', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--primary-gold);
            font-weight: 600;
            margin-bottom: 18px;
        }

        .greeting-container {
            position: relative;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 26px;
        }

        .greeting-text {
            font-size: 1.05rem;
            line-height: 1.65;
            color: var(--text-dim);
            font-weight: 400;
            white-space: pre-line;
        }

        /* כפתור מימוש BUYME */
        .redeem-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 17px 28px;
            font-family: 'Rubik', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #12151f;
            background: linear-gradient(135deg, #fce09b 0%, #e5b95c 50%, #b8860b 100%);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(229, 185, 92, 0.45), 0 0 25px rgba(229, 185, 92, 0.3);
            transition: all 0.3s ease;
        }

        .redeem-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 16px 36px rgba(229, 185, 92, 0.6), 0 0 35px rgba(229, 185, 92, 0.5);
            color: #000;
        }

        .redeem-btn:active {
            transform: scale(0.98);
        }

        .buyme-badge {
            margin-top: 14px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="wrapper">
        <main class="gift-card">
            
            <div class="badge">
                <span>✨</span>
                <span>כרטיס מתנה דיגיטלי</span>
            </div>

            <div class="card-avatar-wrapper">
                <div class="card-avatar-ring"></div>
                <img src="WhatsApp Image 2026-09-13 at 20.50.10.jpeg" alt="משפחה" class="card-avatar">
            </div>

            <h1 class="title">לאבא היקר שלנו!</h1>
            <div class="subtitle">אוהבים ומעריכים מכל הלב ❤️</div>

            <div class="greeting-container">
                <p class="greeting-text">
תודה על כל מה שאתה עושה בשבילנו תמיד.
מאחלים לך המון בריאות, שמחה, נחת והגשמת כל החלומות!
הכנו לך מתנה קטנה ומפנקת שתעשה לך טוב על הלב.
אוהבים אותך הכי בעולם!
                </p>
            </div>

            <a href="https://buyme.co.il/G5uan728dpsjj0" 
               id="redeem-btn" 
               class="redeem-btn" 
               target="_blank" 
               rel="noopener noreferrer"
               onclick="launchCelebration()">
                <span>🎁 למימוש ה-GIFTCARD לחץ כאן</span>
            </a>

            <div class="buyme-badge">שובר דיגיטלי לרכישה ב-BUYME</div>

        </main>
    </div>

    <script>
        function launchCelebration() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 110,
                    spread: 85,
                    origin: { y: 0.7 },
                    colors: ['#e5b95c', '#ffffff', '#ffd700', '#ff6b6b']
                });
            }
        }

        const card = document.querySelector('.gift-card');
        document.addEventListener('mousemove', (e) => {
            const { innerWidth, innerHeight } = window;
            const x = (e.clientX / innerWidth - 0.5) * 12;
            const y = (e.clientY / innerHeight - 0.5) * -12;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
    </script>
</body>
</html>
