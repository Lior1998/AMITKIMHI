<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מתנה מיוחדת לאבא היקר!</title>

    <!-- תצוגה מקדימה לוואטסאפ -->
    <meta property="og:title" content="מתנה מיוחדת לאבא היקר שלנו! 🎁" />
    <meta property="og:description" content="הכנו לך כרטיס מתנה דיגיטלי מכל הלב - לחץ לצפייה ולמימוש ❤️" />
    <meta property="og:image" content="WhatsApp Image 2026-09-13 at 20.50.10.jpeg" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@600;700;900&display=swap" rel="stylesheet">

    <!-- ספריית קונפטי -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold: #f4c453;
            --gold-glow: rgba(244, 196, 83, 0.4);
            --card-bg: rgba(13, 16, 26, 0.88);
            --border: rgba(244, 196, 83, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Assistant', sans-serif;
            background-color: #0b0d14;
            color: #ffffff;
        }

        /* התמונה המשפחתית נקייה, חדה ומותאמת למסך */
        .family-photo {
            position: fixed;
            inset: 0;
            background-image: url('WhatsApp Image 2026-09-13 at 20.50.10.jpeg');
            background-size: cover;
            background-position: center top; /* שומר על הראשים והאנשים למעלה גלויים לגמרי */
            background-repeat: no-repeat;
            z-index: 1;
            transition: transform 0.4s ease;
        }

        /* הצללה עדינה מאוד רק בחלק התחתון כדי שהכרטיס יבלוט */
        .bottom-shade {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(8, 10, 16, 0.95) 0%, rgba(8, 10, 16, 0.4) 60%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* כפתור החלפה למסך מלא (הצג/הסתר תמונה נקייה) */
        .view-toggle-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 30;
            background: rgba(15, 18, 28, 0.75);
            border: 1px solid var(--border);
            color: var(--gold);
            padding: 8px 14px;
            border-radius: 30px;
            font-family: 'Assistant', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .view-toggle-btn:active {
            transform: scale(0.95);
        }

        /* מעטפת התוכן של הנייד */
        .screen-container {
            position: relative;
            z-index: 10;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* הכרטיס יושב למטה ולא מסתיר את התמונה */
            padding: 16px 14px 24px;
            max-width: 440px;
            margin: 0 auto;
        }

        /* כרטיס תחתון צף ואלגנטי */
        .bottom-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid var(--border);
            border-radius: 26px;
            padding: 20px 18px 18px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5), 0 0 25px var(--gold-glow);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
        }

        /* מצב הסתרה כדי לראות את התמונה המשפחתית במלואה */
        .bottom-card.hidden {
            transform: translateY(115%);
            opacity: 0;
            pointer-events: none;
        }

        /* אייקון מתנה צף מעל הכרטיס */
        .floating-gift-badge {
            width: 58px;
            height: 58px;
            margin-top: -46px;
            margin-bottom: 10px;
            background: radial-gradient(circle, #2d3142 0%, #151824 100%);
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), 0 0 15px var(--gold-glow);
            animation: bounce 2.2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .title {
            font-family: 'Rubik', sans-serif;
            font-size: 1.55rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* תיבת הברכה - קומפקטית כדי לא להעמיס על המסך */
        .greeting-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 15px;
            width: 100%;
        }

        .greeting-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-line;
        }

        /* כפתור מימוש BUYME */
        .buyme-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 18px;
            background: linear-gradient(135deg, #ffe082 0%, #f4c453 50%, #c49320 100%);
            color: #10131d;
            font-family: 'Rubik', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 8px 22px rgba(244, 196, 83, 0.4);
            transition: transform 0.15s ease;
        }

        .buyme-btn:active {
            transform: scale(0.97);
        }

        .buyme-subtext {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- תמונת הרקע המשפחתית ללא טשטוש במרכז -->
    <div class="family-photo" id="photoBg"></div>
    <div class="bottom-shade" id="bottomShade"></div>

    <!-- כפתור צפייה בתמונה מלאה -->
    <button class="view-toggle-btn" id="toggleBtn" onclick="toggleCard()">
        <span id="toggleIcon">👁️</span>
        <span id="toggleText">תמונה מלאה</span>
    </button>

    <div class="screen-container">
        <!-- כרטיס תחתון שלא מסתיר את פני האנשים -->
        <div class="bottom-card" id="mainCard">
            
            <div class="floating-gift-badge">🎁</div>

            <h1 class="title">לאבא היקר שלנו!</h1>
            <div class="subtitle">אוהבים ומעריכים מכל הלב ❤️</div>

            <div class="greeting-box">
                <p class="greeting-text">
תודה על כל מה שאתה עושה בשבילנו תמיד.
מאחלים לך המון בריאות, שמחה והגשמת חלומות!
הכנו לך מתנה מפנקת מכל הלב.
אוהבים אותך הכי בעולם!
                </p>
            </div>

            <!-- כפתור למימוש ה-BUYME -->
            <a href="https://buyme.co.il/G5uan728dpsjj0" 
               class="buyme-btn" 
               target="_blank" 
               rel="noopener noreferrer" 
               onclick="triggerConfetti()">
                <span>למימוש ה-GIFTCARD 🎁</span>
            </a>

            <div class="buyme-subtext">שובר אישי למימוש ב-BUYME</div>

        </div>
    </div>

    <script>
        // פונקציית הסתרה/הצגה של הכרטיס כדי לראות את התמונה המלאה
        let isCardVisible = true;
        function toggleCard() {
            const card = document.getElementById('mainCard');
            const shade = document.getElementById('bottomShade');
            const toggleText = document.getElementById('toggleText');
            const toggleIcon = document.getElementById('toggleIcon');

            isCardVisible = !isCardVisible;
            if (isCardVisible) {
                card.classList.remove('hidden');
                shade.style.opacity = '1';
                toggleText.innerText = 'תמונה מלאה';
                toggleIcon.innerText = '👁️';
            } else {
                card.classList.add('hidden');
                shade.style.opacity = '0';
                toggleText.innerText = 'הצג כרטיס';
                toggleIcon.innerText = '🎁';
            }
        }

        // קונפטי בלחיצה על כפתור המימוש
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.75 },
                    colors: ['#f4c453', '#ffffff', '#ffd54f', '#ff5252']
                });
            }
        }
    </script>
</body>
</html>
