<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מתנה מיוחדת לאבא היקר!</title>

    <!-- תצוגה מקדימה לוואטסאפ -->
    <meta property="og:title" content="מתנה מיוחדת לאבא היקר שלנו! 🎁" />
    <meta property="og:description" content="הכנו לך כרטיס מתנה דיגיטלי מכל הלב - לחץ לצפייה ולמימוש ❤️" />
    <meta property="og:image" content="WhatsApp Image 2026-09-13 at 20.50.10.jpeg" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@600;700;900&display=swap" rel="stylesheet">

    <!-- ספריית קונפטי -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold: #f4c453;
            --gold-glow: rgba(244, 196, 83, 0.4);
            --card-bg: rgba(15, 18, 28, 0.82);
            --border: rgba(244, 196, 83, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Assistant', sans-serif;
            background-color: #0d0f17;
            color: #ffffff;
        }

        /* התמונה המשפחתית כרקע מלא למסך הטלפון */
        .mobile-bg {
            position: fixed;
            inset: 0;
            background-image: url('WhatsApp Image 2026-09-13 at 20.50.10.jpeg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* שכבת החשכה עדינה להדגשת התמונה והטקסט */
        .mobile-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, 
                rgba(10, 12, 20, 0.45) 0%, 
                rgba(10, 12, 20, 0.7) 50%, 
                rgba(10, 12, 20, 0.9) 100%
            );
            z-index: 2;
        }

        /* מבנה הנייד */
        .screen-container {
            position: relative;
            z-index: 10;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            max-width: 420px;
            margin: 0 auto;
        }

        /* כרטיס המתנה הדיגיטלי המותאם למובייל */
        .gift-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--gold-glow);
            padding: 26px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* תג עליון */
        .badge {
            background: rgba(244, 196, 83, 0.15);
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        /* עיגול המתנה היוקרתי */
        .gift-icon-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-icon-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px dashed var(--gold);
            animation: rotateGift 20s linear infinite;
        }

        .gift-icon-circle {
            width: 76px;
            height: 76px;
            background: radial-gradient(circle, #2a2d3d 0%, #151722 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 0 12px var(--gold-glow);
            border: 2px solid var(--gold);
            animation: bounceGift 2.4s ease-in-out infinite;
        }

        @keyframes rotateGift {
            100% { transform: rotate(360deg); }
        }

        @keyframes bounceGift {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* כותרות */
        .title {
            font-family: 'Rubik', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 14px;
        }

        /* תיבת הברכה */
        .greeting-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 18px;
            width: 100%;
        }

        .greeting-text {
            font-size: 0.98rem;
            line-height: 1.55;
            color: #e2e8f0;
            white-space: pre-line;
        }

        /* כפתור מימוש BUYME ענק ומותאם לנייד */
        .buyme-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #ffe082 0%, #f4c453 50%, #c49320 100%);
            color: #11141e;
            font-family: 'Rubik', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(244, 196, 83, 0.4), 0 0 15px rgba(244, 196, 83, 0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .buyme-btn:active {
            transform: scale(0.96);
        }

        .buyme-subtext {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- תמונת הרקע המשפחתית שלכם מאחורה -->
    <div class="mobile-bg"></div>
    <div class="mobile-overlay"></div>

    <div class="screen-container">
        <div class="gift-card">
            
            <div class="badge">✨ כרטיס מתנה דיגיטלי אישי ✨</div>

            <!-- עיגול המתנה -->
            <div class="gift-icon-wrapper">
                <div class="gift-icon-ring"></div>
                <div class="gift-icon-circle">🎁</div>
            </div>

            <h1 class="title">לאבא היקר שלנו!</h1>
            <div class="subtitle">אוהבים ומעריכים מכל הלב ❤️</div>

            <div class="greeting-box">
                <p class="greeting-text">
תודה על כל מה שאתה עושה בשבילנו תמיד.
מאחלים לך המון בריאות, שמחה והגשמת חלומות!
הכנו לך מתנה מפנקת מכל הלב.
אוהבים אותך הכי בעולם!
                </p>
            </div>

            <!-- כפתור למימוש ה-BUYME -->
            <a href="https://buyme.co.il/G5uan728dpsjj0" 
               class="buyme-btn" 
               target="_blank" 
               rel="noopener noreferrer" 
               onclick="triggerConfetti()">
                <span>למימוש ה-GIFTCARD 🎁</span>
            </a>

            <div class="buyme-subtext">שובר אישי למימוש ב-BUYME</div>

        </div>
    </div>

    <script>
        // קונפטי חגיגי בלחיצה
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.75 },
                    colors: ['#f4c453', '#ffffff', '#ffd54f', '#ff5252']
                });
            }
        }
    </script>
</body>
</html>
